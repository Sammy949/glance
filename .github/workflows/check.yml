name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js sw.js scripts/*.mjs src-tauri/build-web.mjs; do
            node --check "$file"
          done
      - name: Prepare desktop frontend
        run: node src-tauri/build-web.mjs
      - name: Check release version
        run: node scripts/check-release.mjs

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev
      - name: Prepare desktop frontend
        run: node src-tauri/build-web.mjs
      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
